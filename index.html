<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>OrganizaDia</title>
<style>
:root{--bg:#f5f7f8;--panel:#fff;--text:#182126;--muted:#6b7780;--border:#dfe7ea;--primary:#0f4c5c;--primary2:#14697d;--green:#18794e;--red:#b42318;--shadow:0 14px 40px rgba(30,54,62,.12)}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}.auth-wrap{min-height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef6f8,#f8fbfb)}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:26px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.input{width:100%;border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:44px}.row{display:flex;gap:9px;margin-top:14px}.btn{flex:1;border:1px solid var(--border);border-radius:11px;padding:11px 14px;background:#fff;font-weight:700;cursor:pointer}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn:hover{filter:brightness(.98)}.msg{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.45}.msg.error{color:var(--red)}.app-shell{height:100%;position:relative}.app-frame{width:100%;height:100%;border:0;display:block;background:#fff}.sync-pill{position:fixed;left:12px;bottom:12px;z-index:9999;background:rgba(24,33,38,.92);color:#fff;border-radius:999px;padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.dot{width:8px;height:8px;border-radius:50%;background:#e0a11a}.dot.ok{background:#43b581}.sync-pill button{border:0;background:transparent;color:#fff;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}@media(max-width:640px){.sync-pill{left:8px;bottom:8px;max-width:calc(100% - 16px)}}
</style>
</head>
<body>
<section id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo">OD</div><div><h1>OrganizaDia</h1><p>Entre para sincronizar PC e celular</p></div></div>
    <div class="field"><label for="email">E-mail</label><input id="email" class="input" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"></div>
    <div class="field"><label for="password">Senha</label><input id="password" class="input" type="password" autocomplete="current-password" minlength="6" placeholder="mínimo 6 caracteres"></div>
    <div class="row"><button id="login" class="btn btn-primary">Entrar</button><button id="signup" class="btn">Criar conta</button></div>
    <div id="message" class="msg">Use a mesma conta no computador e no celular para ver as mesmas tarefas.</div>
  </div>
</section>
<section id="app" class="app-shell hidden">
  <iframe id="frame" class="app-frame" title="OrganizaDia"></iframe>
  <div class="sync-pill"><span id="syncDot" class="dot"></span><span id="syncText">Conectando…</span><button id="logout">Sair</button></div>
</section>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://vgagtjcqokqveedbrsyl.supabase.co';
const SUPABASE_KEY='sb_publishable_IOtn-7mF82sBAMPT9U9okA_HYUD2Gm8';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const STORAGE_KEY='organizaDiaWeb.v1';
const $=id=>document.getElementById(id);
let user=null,lastLocal='',lastRemoteTime='',syncTimer=null,pullTimer=null,appLoaded=false,applyingRemote=false;
function setMsg(text,error=false){$('message').textContent=text;$('message').className='msg'+(error?' error':'');}
function setSync(text,ok=false){$('syncText').textContent=text;$('syncDot').className='dot'+(ok?' ok':'');}
function defaultState(){return {version:1,tasks:[],settings:{whatsappNumber:''}}}
function localState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||defaultState()}catch{return defaultState()}}
function normalizedString(obj){try{return JSON.stringify(obj)}catch{return JSON.stringify(defaultState())}}
async function saveRemote(state){
  if(!user||applyingRemote)return;
  setSync('Salvando…');
  const now=new Date().toISOString();
  const {data,error}=await supabase.from('organiza_state').upsert({user_id:user.id,state,updated_at:now},{onConflict:'user_id'}).select('updated_at').single();
  if(error){console.error(error);setSync('Erro ao sincronizar');return;}
  lastRemoteTime=data?.updated_at||now;lastLocal=normalizedString(state);setSync('Sincronizado',true);
}
async function fetchRemote(){
  if(!user)return;
  const {data,error}=await supabase.from('organiza_state').select('state,updated_at').eq('user_id',user.id).maybeSingle();
  if(error){console.error(error);setSync('Erro ao sincronizar');return null;}
  return data;
}
async function startSync(){
  const remote=await fetchRemote();
  const local=localState();
  if(!remote){
    await saveRemote(local);
  }else{
    const remoteString=normalizedString(remote.state||defaultState());
    lastRemoteTime=remote.updated_at||'';
    if(remoteString!==normalizedString(local)){
      applyingRemote=true;localStorage.setItem(STORAGE_KEY,remoteString);applyingRemote=false;
    }
    lastLocal=remoteString;
  }
  if(!appLoaded){$('frame').src='./app.html';appLoaded=true;}
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');setSync('Sincronizado',true);
  clearInterval(syncTimer);clearInterval(pullTimer);
  syncTimer=setInterval(async()=>{
    const current=normalizedString(localState());
    if(current!==lastLocal)await saveRemote(JSON.parse(current));
  },900);
  pullTimer=setInterval(async()=>{
    const r=await fetchRemote();if(!r)return;
    if(r.updated_at&&r.updated_at!==lastRemoteTime){
      const rs=normalizedString(r.state||defaultState());
      if(rs!==normalizedString(localState())){
        applyingRemote=true;localStorage.setItem(STORAGE_KEY,rs);applyingRemote=false;lastLocal=rs;
        $('frame').contentWindow?.location.reload();
      }
      lastRemoteTime=r.updated_at;setSync('Sincronizado',true);
    }
  },4000);
}
async function handleSession(session){
  user=session?.user||null;
  if(user){await startSync();}else{$('app').classList.add('hidden');$('auth').classList.remove('hidden');}
}
$('login').addEventListener('click',async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){setMsg('Informe e-mail e senha.',true);return;}
  setMsg('Entrando…');
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error){setMsg('Não foi possível entrar: '+error.message,true);return;}
  await handleSession(data.session);
});
$('signup').addEventListener('click',async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||password.length<6){setMsg('Informe um e-mail e uma senha com pelo menos 6 caracteres.',true);return;}
  setMsg('Criando conta…');
  const {data,error}=await supabase.auth.signUp({email,password});
  if(error){setMsg('Não foi possível criar a conta: '+error.message,true);return;}
  if(data.session){await handleSession(data.session);}else{setMsg('Conta criada. Confira seu e-mail e confirme o cadastro; depois volte aqui e clique em Entrar.');}
});
$('logout').addEventListener('click',async()=>{clearInterval(syncTimer);clearInterval(pullTimer);await supabase.auth.signOut();location.reload();});
supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!user)handleSession(session);});
const {data:{session}}=await supabase.auth.getSession();await handleSession(session);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script>
</body>
</html>
